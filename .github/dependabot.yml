version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      production-patch-and-minor:
        dependency-type: production
        update-types: [minor, patch]
      development-patch-and-minor:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']
